name: Build

# `"*"` RAN THIS TWICE per commit on a PR branch — once for the push, once for the pull_request
# event on the same SHA — and there is no concurrency group here at all, so nothing collapsed them.
#
# Note `"*"` was also narrower than it looks: a single `*` matches one path segment, so `feat/x`
# never matched it and only flat branch names double-ran. `main` is this repo's default branch —
# unlike the rest of the estate, which is on develop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - run: go build -v
